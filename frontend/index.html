<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>React-like Frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      async function callBackend(){
        try{
          const r = await fetch('/api')
          const j = await r.json()
          document.getElementById('root').innerText = j.message
        }catch(e){
          document.getElementById('root').innerText = 'Could not reach backend: '+e
        }
      }
      callBackend()
    </script>
  </body>
</html>
