services:
  auth-service:
    image: trancendance-auth-service:latest
    build:
      context: .
      dockerfile: backend/services/auth_service/Dockerfile
    ports:
      - "5001:5001"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DATABASE_URL=${SUPABASE_DB_URL}
    networks:
      - app-network
    restart: unless-stopped

  chat-service:
    image: trancendance-chat-service:latest
    build:
      context: .
      dockerfile: backend/services/chat_service/Dockerfile
    ports:
      - "5002:5002"
    environment:
      - DATABASE_URL=${SUPABASE_DB_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    networks:
      - app-network
    restart: unless-stopped

  org-service:
    image: trancendance-org-service:latest
    build:
      context: .
      dockerfile: backend/services/org_service/Dockerfile
    ports:
      - "5003:5003"
    environment:
      - DATABASE_URL=${SUPABASE_DB_URL}
    networks:
      - app-network
    restart: unless-stopped

  notification-service:
    image: trancendance-notification-service:latest
    build:
      context: .
      dockerfile: backend/services/notification_service/Dockerfile
    ports:
      - "5004:5004"
    environment:
      - DATABASE_URL=${SUPABASE_DB_URL}
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    image: node:20.19-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      # Frontend configuration - use localhost for browser connections
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      # IMPORTANT: Use localhost for browser WebSocket connections
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL}
      - NEXT_PUBLIC_CHAT_API_URL=${NEXT_PUBLIC_CHAT_API_URL}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - auth-service
      - chat-service
      - org-service
      - notification-service
    env_file:
      - ./.env
    networks:
      - app-network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9101:9100"
    volumes:
      - /:/host:ro
    command:
      - '--path.rootfs=/host'
    networks:
      - app-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    networks:
      - app-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED}
      - GF_SMTP_HOST=${GF_SMTP_HOST}
      - GF_SMTP_USER=${GF_SMTP_USER}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS}
      - GF_SMTP_FROM_NAME=${GF_SMTP_FROM_NAME}
      - GF_SMTP_SKIP_VERIFY=${GF_SMTP_SKIP_VERIFY}
      - GF_SMTP_STARTTLS_POLICY=${GF_SMTP_STARTTLS_POLICY}
      - GF_SMTP_EHLO_IDENTITY=${GF_SMTP_EHLO_IDENTITY}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - app-network
    restart: unless-stopped

# Define the network for all services to communicate
networks:
  app-network:
    driver: bridge