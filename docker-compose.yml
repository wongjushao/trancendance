services:
  auth-service:
    build: ./backend/services/auth_service
    ports:
      - "5001:5001"
    environment:
      - AUTH_SUPABASE_URL=${AUTH_SUPABASE_URL}
      - AUTH_SUPABASE_ANON_KEY=${AUTH_SUPABASE_ANON_KEY}

  chat-service:
    build: ./backend/services/chat_service
    ports:
      - "5002:5002"
    environment:
      - CHAT_SUPABASE_URL=${CHAT_SUPABASE_URL}
      - CHAT_SUPABASE_SERVICE_ROLE_KEY=${CHAT_SUPABASE_SERVICE_ROLE_KEY}
      - CHAT_TABLE=${CHAT_TABLE}

  org-service:
    build: ./backend/services/org_service
    ports:
      - "5003:5003"
    environment:
      - ORG_SUPABASE_URL=${ORG_SUPABASE_URL}
      - ORG_SUPABASE_SERVICE_ROLE_KEY=${ORG_SUPABASE_SERVICE_ROLE_KEY}
      - ORG_TABLE=${ORG_TABLE}

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - auth-service
      - chat-service
      - org-service
  
  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9101:9100"
    volumes:
      - /:/host:ro,rslave
    command:
      - '--path.rootfs=/host'


  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED}
      - GF_SMTP_HOST=${GF_SMTP_HOST}
      - GF_SMTP_USER=${GF_SMTP_USER}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS}
      - GF_SMTP_FROM_NAME=${GF_SMTP_FROM_NAME}
      - GF_SMTP_SKIP_VERIFY=${GF_SMTP_SKIP_VERIFY}
      - GF_SMTP_STARTTLS_POLICY=${GF_SMTP_STARTTLS_POLICY}
      - GF_SMTP_EHLO_IDENTITY=${GF_SMTP_EHLO_IDENTITY}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
