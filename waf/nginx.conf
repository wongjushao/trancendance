server_tokens off;

map ${DOLLAR}http_upgrade ${DOLLAR}connection_upgrade {
  default upgrade;
  '' close;
}

upstream frontend_upstream {
  server frontend:3000;
}

upstream prometheus_upstream {
  server prometheus:9090;
}

upstream grafana_upstream {
  server grafana:3000;
}

upstream auth_service_upstream {
  server auth-service:5001;
}

upstream chat_service_upstream {
  server chat-service:5002;
}

upstream org_service_upstream {
  server org-service:5003;
}

upstream notification_service_upstream {
  server notification-service:5004;
}

server {
  listen 8080 default_server;
  server_name localhost;
  port_in_redirect off;

  location / {
    return 301 https://${DOLLAR}host${DOLLAR}request_uri;
  }
}

server {
  listen 8443 ssl;
  server_name localhost;
  port_in_redirect off;

  ssl_certificate /etc/nginx/certs/internal-services.crt;
  ssl_certificate_key /etc/nginx/certs/internal-services.key;
  ssl_session_timeout 1d;
  ssl_session_cache shared:MozSSL:10m;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  client_max_body_size 10m;

  location / {
    proxy_set_header Host ${DOLLAR}host;
    proxy_set_header Proxy "";
    proxy_set_header Upgrade ${DOLLAR}http_upgrade;
    proxy_set_header Connection ${DOLLAR}connection_upgrade;
    proxy_set_header X-REAL-IP ${DOLLAR}remote_addr;
    proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Port ${DOLLAR}server_port;
    proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_connect_timeout 60s;
    proxy_read_timeout 36000s;
    proxy_redirect off;
    proxy_pass_header Authorization;
    proxy_pass http://frontend_upstream;
  }

  location /grafana/ {
    proxy_set_header Host ${DOLLAR}host;
    proxy_set_header Proxy "";
    proxy_set_header Upgrade ${DOLLAR}http_upgrade;
    proxy_set_header Connection ${DOLLAR}connection_upgrade;
    proxy_set_header X-REAL-IP ${DOLLAR}remote_addr;
    proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Port ${DOLLAR}server_port;
    proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_connect_timeout 60s;
    proxy_read_timeout 36000s;
    proxy_redirect off;
    proxy_pass_header Authorization;
    proxy_set_header X-Forwarded-Prefix /grafana;
    proxy_ssl_server_name on;
    proxy_ssl_name grafana;
    proxy_ssl_trusted_certificate /etc/nginx/certs/internal-ca.crt;
    proxy_ssl_verify on;
    proxy_pass https://grafana_upstream;
  }

  location /prometheus/ {
    proxy_set_header Host ${DOLLAR}host;
    proxy_set_header Proxy "";
    proxy_set_header Upgrade ${DOLLAR}http_upgrade;
    proxy_set_header Connection ${DOLLAR}connection_upgrade;
    proxy_set_header X-REAL-IP ${DOLLAR}remote_addr;
    proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Port ${DOLLAR}server_port;
    proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_connect_timeout 60s;
    proxy_read_timeout 36000s;
    proxy_redirect off;
    proxy_pass_header Authorization;
    proxy_set_header X-Forwarded-Prefix /prometheus;
    proxy_ssl_server_name on;
    proxy_ssl_name prometheus;
    proxy_ssl_trusted_certificate /etc/nginx/certs/internal-ca.crt;
    proxy_ssl_verify on;
    proxy_pass https://prometheus_upstream;
  }

  location /api/auth-service/ {
    proxy_set_header Host ${DOLLAR}host;
    proxy_set_header Proxy "";
    proxy_set_header Upgrade ${DOLLAR}http_upgrade;
    proxy_set_header Connection ${DOLLAR}connection_upgrade;
    proxy_set_header X-REAL-IP ${DOLLAR}remote_addr;
    proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Port ${DOLLAR}server_port;
    proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_connect_timeout 60s;
    proxy_read_timeout 36000s;
    proxy_redirect off;
    proxy_pass_header Authorization;
    proxy_set_header X-Forwarded-Prefix /api/auth-service;
    proxy_set_header X-Script-Name /api/auth-service;
    proxy_ssl_server_name on;
    proxy_ssl_name auth-service;
    proxy_ssl_trusted_certificate /etc/nginx/certs/internal-ca.crt;
    proxy_ssl_verify on;
    proxy_pass https://auth_service_upstream;
  }

  location /api/chat-service/ {
    proxy_set_header Host ${DOLLAR}host;
    proxy_set_header Proxy "";
    proxy_set_header Upgrade ${DOLLAR}http_upgrade;
    proxy_set_header Connection ${DOLLAR}connection_upgrade;
    proxy_set_header X-REAL-IP ${DOLLAR}remote_addr;
    proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Port ${DOLLAR}server_port;
    proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_connect_timeout 60s;
    proxy_read_timeout 36000s;
    proxy_redirect off;
    proxy_pass_header Authorization;
    proxy_set_header X-Forwarded-Prefix /api/chat-service;
    proxy_set_header X-Script-Name /api/chat-service;
    proxy_ssl_server_name on;
    proxy_ssl_name chat-service;
    proxy_ssl_trusted_certificate /etc/nginx/certs/internal-ca.crt;
    proxy_ssl_verify on;
    # Trailing URI strips /api/chat-service/ so upstream sees /socket.io (Socket.IO) and /rooms.
    # Matches Next.js rewrites; Flask-SocketIO is mounted only at /socket.io.
    proxy_pass https://chat_service_upstream/;
  }

  location /api/org-service/ {
    proxy_set_header Host ${DOLLAR}host;
    proxy_set_header Proxy "";
    proxy_set_header Upgrade ${DOLLAR}http_upgrade;
    proxy_set_header Connection ${DOLLAR}connection_upgrade;
    proxy_set_header X-REAL-IP ${DOLLAR}remote_addr;
    proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Port ${DOLLAR}server_port;
    proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_connect_timeout 60s;
    proxy_read_timeout 36000s;
    proxy_redirect off;
    proxy_pass_header Authorization;
    proxy_set_header X-Forwarded-Prefix /api/org-service;
    proxy_set_header X-Script-Name /api/org-service;
    proxy_ssl_server_name on;
    proxy_ssl_name org-service;
    proxy_ssl_trusted_certificate /etc/nginx/certs/internal-ca.crt;
    proxy_ssl_verify on;
    # Trailing URI strips /api/org-service/ so upstream matches Flask routes (same as Next.js rewrites).
    proxy_pass https://org_service_upstream/;
  }

  location /api/notification-service/ {
    proxy_set_header Host ${DOLLAR}host;
    proxy_set_header Proxy "";
    proxy_set_header Upgrade ${DOLLAR}http_upgrade;
    proxy_set_header Connection ${DOLLAR}connection_upgrade;
    proxy_set_header X-REAL-IP ${DOLLAR}remote_addr;
    proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Port ${DOLLAR}server_port;
    proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_connect_timeout 60s;
    proxy_read_timeout 36000s;
    proxy_redirect off;
    proxy_pass_header Authorization;
    proxy_set_header X-Forwarded-Prefix /api/notification-service;
    proxy_set_header X-Script-Name /api/notification-service;
    proxy_ssl_server_name on;
    proxy_ssl_name notification-service;
    proxy_ssl_trusted_certificate /etc/nginx/certs/internal-ca.crt;
    proxy_ssl_verify on;
    # Trailing URI strips /api/notification-service/ (Flask routes are at /notification, /health, …).
    proxy_pass https://notification_service_upstream/;
  }
}