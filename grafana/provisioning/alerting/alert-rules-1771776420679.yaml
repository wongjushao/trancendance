        - uid: efh9ioih47bwgc
          title: High CPU Usage
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: code
                expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 85
                        type: gt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 20s
          keepFiringFor: 20s
          annotations:
            description: Instance {{ $labels.instance }} CPU usage has stayed above 85% for 5 minutes.
            summary: CPU usage is above 85%
          isPaused: false
          notification_settings:
            receiver: admin
        - uid: cfh9isngx61vka
          title: High Memory Usage
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: code
                expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 85
                        type: gt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 20s
          keepFiringFor: 20s
          annotations:
            description: Instance {{ $labels.instance }} memory usage has stayed above 85% for 5 minutes.
            summary: Memory usage is above 85%
          isPaused: false
          notification_settings:
            receiver: admin
        - uid: efh9kyly782yof
          title: Disk Usage High (Critical)
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: prometheus
              model:
                editorMode: code
                expr: |-
                    (
                      1 - (
                        node_filesystem_avail_bytes{mountpoint="/home/wjun-kea",fstype!~"tmpfs|overlay"}
                        /
                        node_filesystem_size_bytes{mountpoint="/home/wjun-kea",fstype!~"tmpfs|overlay"}
                      )
                    ) * 100
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 80
                        type: gt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 20s
          keepFiringFor: 20s
          annotations:
            description: |-
                Instance {{ $labels.instance }} mount {{ $labels.mountpoint }}
                  disk usage is above threshold.
            summary: Disk Usage High (Critical)
          isPaused: false
          notification_settings:
            receiver: admin