[security]
admin_user = $__env{GF_SECURITY_ADMIN_USER}
admin_password = $__env{GF_SECURITY_ADMIN_PASSWORD}

[server]
root_url = https://localhost/grafana/
serve_from_sub_path = true
protocol = https
cert_file = /etc/trancendance-certs/internal-services.crt
cert_key = /etc/trancendance-certs/internal-services.key